name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Check Stockfish
        run: test -f lib/arm64-v8a/libstockfish.so
      - name: Build APK
        run: dotnet build ChessHelper.csproj -c Debug
      - name: Find APK
        run: find . -name "*.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-apk
          path: '**/*-Signed.apk'
